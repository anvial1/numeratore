# Eliminacode: the monitor's camera player through Apache → go2rtc on 127.0.0.1:1984 (LAN server only).
# Installed as /etc/apache2/conf-available/eliminacode-go2rtc.conf by bin/install-go2rtc.sh.
# Only the player scripts and the stream websocket of a camera name (c / t + 16 hex, see queueCameraName())
# get through: the rest of the go2rtc API (adding sources, ONVIF, config) stays on localhost.
ProxyPass        /go2rtc/video-rtc.js http://127.0.0.1:1984/video-rtc.js
ProxyPassReverse /go2rtc/video-rtc.js http://127.0.0.1:1984/video-rtc.js
ProxyPass        /go2rtc/api/ws       ws://127.0.0.1:1984/api/ws
<Location "/go2rtc/api/ws">
    <If "%{QUERY_STRING} !~ /^src=[ct][0-9a-f]{16}$/">
        Require all denied
    </If>
</Location>
